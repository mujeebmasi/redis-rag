# ============================================================
# RedisRAG - Docker Compose (local development)
# ============================================================
# Starts Redis with vector search support:
#   docker compose up -d
#
# Redis Stack = Redis + the RediSearch module (vector search)
# + RedisInsight, a web UI for browsing keys at http://localhost:8001
# ============================================================

services:

  redis:
    image: redis/redis-stack:latest
    container_name: redis-rag-redis
    ports:
      - "6379:6379"     # Redis protocol
      - "8001:8001"     # RedisInsight web UI (optional, nice for debugging)
    volumes:
      - redis_data:/data
    restart: unless-stopped

# Named volume persists data across container restarts
volumes:
  redis_data:
