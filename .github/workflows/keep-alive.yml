name: Keep the backend awake

# Render's free plan stops the server after 15 minutes without a request,
# and the next visitor then waits about a minute for it to start again.
# Asking /health every 10 minutes keeps it running. /health also talks to
# Redis, so the free Redis Cloud database keeps seeing activity.
#
# If /health is unreachable or not "ok" (Redis down, a key missing), the run
# fails and GitHub emails the repository owner: a free uptime alert.
#
# Things to know about scheduled workflows:
# - They only run from the default branch (main).
# - They can start a few minutes late when GitHub is busy.
# - GitHub pauses them after 60 days without any commit to the repository.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the backend for /health
        run: |
          body=$(curl --silent --show-error --fail --max-time 120 https://redis-rag-1.onrender.com/health)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
